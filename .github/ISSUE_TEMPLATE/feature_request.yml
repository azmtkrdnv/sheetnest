name: Feature request
description: Suggest an improvement (new file format, post-processor, cutting feature...)
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the job or workflow, not just the feature.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
